name: Resell AI - daily product selection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  select-products:
    runs-on: ubuntu-latest

    env:
      CJ_ACCESS_TOKEN: ${{ secrets.CJ_ACCESS_TOKEN }}
      MAX_PRODUCTS: "60"
      COMMISSION_PCT: "13"
      TARGET_MARGIN_PCT: "25"
      CJ_COUNTRY_CODE: "FR"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run worker
        run: python worker.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add selected_products.csv draft_listings.csv cj_candidates.csv
          git diff --cached --quiet || git commit -m "auto: refresh CJ product candidates"
          git pull --rebase origin main
          git push
